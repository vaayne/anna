          format: int64
        reported_call_count:
          type: integer
          format: int64
        priced_call_count:
          type: integer
          format: int64
        input_tokens:
          type: integer
          format: int64
          nullable: true
        output_tokens:
          type: integer
          format: int64
          nullable: true
        cache_read_tokens:
          type: integer
          format: int64
          nullable: true
        cache_write_tokens:
          type: integer
          format: int64
          nullable: true
        cost_usd:
          type: number
          format: double
          nullable: true
