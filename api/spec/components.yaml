openapi: 3.0.3
info:
  title: stella API Components
  version: "1"
  description: Assembled from api/spec/components/common.yaml + api/spec/domain/*/schemas.yaml — DO NOT EDIT
paths: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Personal access token or OAuth access token created in the Web UI
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code:
              type: integer
              description: mirrors the HTTP status code
            message:
              type: string
              description: human-readable, actionable description
            status:
              type: string
              description: canonical status name (e.g. NOT_FOUND, INVALID_ARGUMENT)
            details:
              type: object
              additionalProperties: true
              description: optional machine-readable error details; keys use snake_case
    RemovalSource:
      type: string
      enum: [manual, curator]
    SandboxNetworkConfig:
      type: object
      properties:
        mode:
          type: string
        allowlist:
          type: array
          items:
            type: string
    SandboxConfig:
      type: object
      properties:
        network:
          $ref: "#/components/schemas/SandboxNetworkConfig"
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
        model_thinking:
          type: string
        model_strong:
          type: string
        model_strong_thinking:
          type: string
        model_fast:
          type: string
        model_fast_thinking:
          type: string
        system_prompt:
          type: string
        soul:
          type: string
        workspace:
          type: string
        sandbox:
          $ref: "#/components/schemas/SandboxConfig"
        scope:
          type: string
        creator_id:
          type: string
          readOnly: true
          description: >-
            The user who created the agent. Returned only to someone who may manage it, so an ordinary user cannot collect user ids from the agent list.
        can_manage:
          type: boolean
          readOnly: true
          description: >-
            Whether the calling user may configure this agent. The server's answer; clients must not recompute it from creator_id.
        enabled:
          type: boolean
        system_settings_tools_enabled:
          type: boolean
          description: >-
            Enables discovery of System Settings tools for direct foreground one-to-one human turns. Returned only to callers who can manage this Agent; it does not grant domain or deployment permissions.
        last_active:
          type: string
          format: date-time
          nullable: true
    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
    CreateAgentRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
        model_thinking:
          type: string
        model_strong:
          type: string
        model_strong_thinking:
          type: string
        model_fast:
          type: string
        model_fast_thinking:
          type: string
        system_prompt:
          type: string
        soul:
          type: string
        workspace:
          type: string
        sandbox:
          $ref: "#/components/schemas/SandboxConfig"
        scope:
          type: string
        creator_id:
          type: string
        enabled:
          type: boolean
        system_settings_tools_enabled:
          type: boolean
          default: false
          description: >-
            Starts disabled unless the Agent manager explicitly enables Settings-tool discovery.
        template_id:
          type: string
        provider_credentials:
          type: array
          maxItems: 8
          description: >-
            Optional write-only API-key overrides for canonical global Providers. Omit to use deployment-global Provider keys.
          items:
            $ref: "#/components/schemas/AgentProviderCredentialInput"
    AgentProviderCredentialInput:
      type: object
      required: [provider_id, api_key]
      properties:
        provider_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Canonical global Provider ID; type aliases are not accepted.
        api_key:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
          description: Write-only API key override. Use DELETE to restore the global key.
    AgentProviderCredential:
      type: object
      required: [id, has_api_key, updated_at]
      properties:
        id:
          type: string
          readOnly: true
          description: Canonical global Provider ID for this override.
        has_api_key:
          type: boolean
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    AgentProviderCredentialList:
      type: object
      required: [provider_credentials, next_page_token, total_size]
      properties:
        provider_credentials:
          type: array
          items:
            $ref: "#/components/schemas/AgentProviderCredential"
        next_page_token:
          type: string
          nullable: true
        total_size:
          type: integer
    UpdateAgentProviderCredentialRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
          description: Write-only replacement API key. Use DELETE to restore the global key.
    AgentUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
    AgentUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AgentUser"
    AssignAgentUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
    AgentTool:
      type: object
      required: [name, description, source, control]
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
        control:
          type: string
          enum: [override, system]
          description: >-
            override means a persisted tool override changes runner registration in this profile context. system means policy or runtime owns the row; clients must not offer an override control.
        enabled:
          type: boolean
          description: Present only when control is override.
        origin:
          type: string
          description: Present only when control is override; the winning override layer.
        family:
          type: string
          description: >-
            Stable backend-owned family identifier for grouping a non-MCP tool. Settings policy actions use display families such as agent_management; generated builtin actions use their toolmeta family; hand-written core and plugin tools use stable fallback families. Clients must not infer this value from the tool name.
        policy_reason:
          type: string
          enum: [core_sandbox, settings_policy, runtime_unavailable]
          description: Why a system-managed row cannot be overridden.
        availability_reason:
          type: string
          enum: [
            email_config_required,
            mcp_server_disabled,
            mcp_server_error,
            mcp_needs_auth,
          ]
          description: >-
            Concrete prerequisite that made a runtime-unavailable row absent or an override ineffective. mcp_* reasons mean the tool's server is disabled, unhealthy, or rejecting credentials; the override stays editable but has no effect until the server is healthy. Present only when the server's authoritative availability check establishes this reason; clients must not infer it from tool names.
        admin_required:
          type: boolean
          description: True when the Settings action requires a deployment administrator at execution time.
        input_schema:
          type: object
          additionalProperties: true
          description: >-
            JSON Schema for the tool's arguments. Present for core and builtin tools; omitted for plugin and MCP tools whose schema is not resolved by this endpoint.
    AgentToolList:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/AgentTool"
    UpdateAgentToolRequest:
      type: object
      properties:
        enabled:
          type: boolean
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
          default: user_agent
    Skill:
      type: object
      required: [lifecycle_version, created_by]
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [project, user, user_agent, system, system_agent, builtin]
        user_id:
          type: string
        agent_id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        disable_model_invocation:
          type: boolean
        files:
          type: array
          items:
            type: string
        source:
          type: string
        version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lifecycle_version:
          type: integer
          format: int64
        content_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Exact immutable revision digest for mutable Home-backed Skills.
        created_by:
          type: string
          enum: [manual, reflect]
        builtin:
          type: boolean
          readOnly: true
          description: True when this read-only Skill is supplied by the release bundle.
        logical_ref:
          type: string
          readOnly: true
          description: Exact AgentSkillPolicy ref when this Skill can be activated per Agent.
        enabled:
          type: boolean
          readOnly: true
          description: Effective Agent Skill activation, independent of disable_model_invocation.
    SkillScopeCounts:
      type: object
      required: [all, builtin, system, agent, user, project]
      properties:
        all:
          type: integer
        builtin:
          type: integer
        system:
          type: integer
        agent:
          type: integer
        user:
          type: integer
        project:
          type: integer
    SkillList:
      type: object
      required: [skills, total_size, scope_counts]
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        total_size:
          type: integer
        scope_counts:
          $ref: "#/components/schemas/SkillScopeCounts"
        next_page_token:
          type: string
          nullable: true
        can_manage_activation:
          type: boolean
          readOnly: true
        policy_diagnostics:
          $ref: "#/components/schemas/AgentSkillPolicyDiagnostics"
    AgentSkillPolicyDiagnostics:
      type: object
      required: [dangling_disabled_refs]
      properties:
        dangling_disabled_refs:
          type: array
          items:
            type: string
    AgentSkillActivation:
      type: object
      required: [logical_ref, enabled]
      properties:
        logical_ref:
          type: string
        enabled:
          type: boolean
    UpdateAgentSkillActivationRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    CreateSkillRequest:
      type: object
      required: [name, scope]
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [user, user_agent, system_agent]
        description:
          type: string
        disable_model_invocation:
          type: boolean
        files:
          type: object
          additionalProperties:
            type: string
    UpdateSkillRequest:
      type: object
      properties:
        expected_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Required exact current digest when mutating a Home-backed Skill.
        description:
          type: string
          nullable: true
        disable_model_invocation:
          type: boolean
          nullable: true
        # Overwrites only the "version" key in the skill's metadata; source and
        # install timestamps are preserved by a read-modify-write on the server.
        version:
          type: string
          nullable: true
        convert_to_manual:
          type: boolean
        files:
          type: object
          additionalProperties:
            type: string
    InstallSkillRequest:
      type: object
      required: [source, scope]
      properties:
        source:
          type: string
        scope:
          type: string
          enum: [user, user_agent, system_agent]
    SkillFileResponse:
      type: object
      properties:
        path:
          type: string
        content:
          type: string
        encoding:
          type: string
          enum: [utf8, base64]
          description: >-
            How `content` is encoded. Omitted or `utf8` for text files; `base64` when the stored file is not valid UTF-8 (binary).
    SkillUpgradeResult:
      type: object
      properties:
        updated:
          type: boolean
        version:
          type: string
        previous_version:
          type: string
    AgentMCPServer:
      type: object
      required: [
        plugin_id,
        config_id,
        namespace,
        scope,
        enabled,
        credential_mode,
        needs_auth,
        status,
        tools,
        readable,
      ]
      additionalProperties: false
      description: >-
        Safe effective MCP projection for an agent. It intentionally omits the endpoint, payload, metadata, credential references, and OAuth details.
      properties:
        plugin_id:
          type: string
        config_id:
          type: string
        namespace:
          type: string
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
        enabled:
          type: boolean
        credential_mode:
          type: string
          enum: [shared, per_user]
        needs_auth:
          type: boolean
        status:
          type: string
          enum: [unknown, ok, error, needs_auth]
        tools:
          type: array
          items:
            $ref: "#/components/schemas/MCPTool"
        readable:
          type: boolean
    AgentMCPServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/AgentMCPServer"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    MeResponse:
      type: object
      required: [id, username, role, is_admin]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
        is_admin:
          type: boolean
        email:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        has_credentials:
          type: boolean
    AuthSession:
      type: object
      required: [id, expires_at, created_at]
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    AuthSessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AuthSession"
    LocalLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LocalRegisterRequest:
      type: object
      required: [name, email, password, confirm_password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        confirm_password:
          type: string
          format: password
    LocalAuthRedirect:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          description: URL the browser should navigate to after local authentication.
    OIDCProvider:
      type: object
      required: [name, login_url]
      properties:
        name:
          type: string
          description: Human-readable provider name (e.g. "Zitadel")
        login_url:
          type: string
          description: URL to redirect the browser to for login
        register_url:
          type: string
          description: URL to redirect the browser to for registration (local provider only)
    OIDCProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OIDCProvider"
    BuiltinResource:
      type: object
      required: [kind, id, name]
      properties:
        kind:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        hash:
          type: string
    BuiltinResourceDetail:
      type: object
      required: [kind, id, name, content]
      properties:
        kind:
          type: string
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        hash:
          type: string
        content:
          type: string
    BuiltinResourceList:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/BuiltinResource"
    Channel:
      type: object
      required: [id, name, type, is_active, config]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        agent_id:
          type: string
        is_active:
          type: boolean
          description: Whether this channel instance accepts and delivers messages.
        config:
          type: string
          description: "JSON string of the channel config"
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    FeishuChat:
      type: object
      description: A group chat the configured Feishu bot currently belongs to.
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    FeishuChatList:
      type: object
      required: [chats, next_page_token]
      properties:
        chats:
          type: array
          items:
            $ref: "#/components/schemas/FeishuChat"
        next_page_token:
          type: string
          nullable: true
    PublicChannel:
      type: object
      required: [id, type, label, is_active]
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        agent_id:
          type: string
        agent_name:
          type: string
        is_active:
          type: boolean
          description: Whether this channel instance accepts and delivers messages.
    PublicChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/PublicChannel"
    ChannelWriteRequest:
      type: object
      properties:
        id:
          type: string
          description: >-
            Channel id. Optional on create — the server mints an independent uuid when it is omitted. Ignored on update; the path id wins.
        name:
          type: string
          description: >-
            Display name. Optional on create — the server defaults it to "{type}-{random suffix}" when it is omitted.
        type:
          type: string
          nullable: true
        agent_id:
          type: string
          nullable: true
        is_active:
          type: boolean
          nullable: true
          description: Set whether this channel instance accepts and delivers messages.
        config:
          type: string
          description: >-
            JSON string of the channel config. Omit to keep the current config; pass an object to replace it.
    BindChannelRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
          description: >-
            Agent to bind this channel to. An empty string unbinds the channel.
    FeishuRegistrationInitRequest:
      type: object
      properties:
        brand:
          type: string
          enum: [feishu, lark]
          default: feishu
    FeishuRegistrationInit:
      type: object
      required: [supported_auth_methods]
      properties:
        supported_auth_methods:
          type: array
          items:
            type: string
    FeishuRegistrationBeginRequest:
      type: object
      properties:
        brand:
          type: string
          enum: [feishu, lark]
          default: feishu
        auto_provision:
          type: boolean
          default: false
          description: Include the contact scopes required for Feishu user auto-provisioning.
        app_id:
          type: string
          description: >-
            Existing Feishu app id to update. Omit this to create a new app.
    FeishuRegistrationBegin:
      type: object
      required: [
        device_code,
        verification_uri_complete,
        qr_url,
        interval,
        expires_in,
      ]
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
        qr_url:
          type: string
        interval:
          type: integer
        expires_in:
          type: integer
    FeishuRegistrationPollRequest:
      type: object
      required: [device_code, agent_id]
      properties:
        device_code:
          type: string
        channel_id:
          type: string
          description: >-
            Optional. The server mints a uuid for the channel it creates when this is omitted.
        agent_id:
          type: string
        name:
          type: string
        brand:
          type: string
          enum: [feishu, lark]
          default: feishu
        is_active:
          type: boolean
          default: true
        config:
          type: object
          additionalProperties: true
    FeishuRegistrationPoll:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, slow_down, created]
        interval:
          type: integer
        tenant_brand:
          type: string
        channel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Channel"
    WeixinRegistrationBeginRequest:
      type: object
      properties:
        channel_id:
          type: string
          description: >-
            Existing Weixin channel instance to update. Omit this to mint a new instance id; the returned id must be sent with every poll.
    WeixinRegistrationBegin:
      type: object
      required: [channel_id, qrcode, qr_image_url, poll_interval]
      properties:
        channel_id:
          type: string
          description: Exact channel instance id to use for this registration.
        qrcode:
          type: string
        qr_image_url:
          type: string
        poll_interval:
          type: integer
    WeixinRegistrationPollRequest:
      type: object
      required: [qrcode, channel_id, agent_id]
      properties:
        qrcode:
          type: string
        channel_id:
          type: string
          description: >-
            Exact channel instance id returned by begin. The server verifies that it is a Weixin row before saving credentials.
        agent_id:
          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties: true
    WeixinRegistrationPoll:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: >-
            Registration status. "created" is synthesized by Stella once credentials are saved; all other values are passed through verbatim from the iLink scan status (e.g. wait, scaned, expired) and are not an exhaustive set.
        poll_interval:
          type: integer
        channel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Channel"
    WeixinQRCode:
      type: object
      properties:
        qrcode:
          type: string
        qrcode_img_content:
          type: string
    WeixinQRStatus:
      type: object
      properties:
        status:
          type: string
        bot_token:
          type: string
        ilink_bot_id:
          type: string
        ilink_user_id:
          type: string
        baseurl:
          type: string
    ClawhubSkill:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
        summary:
          type: string
        version:
          type: string
        downloads:
          type: integer
        installs:
          type: integer
        updated_at:
          type: string
          format: date-time
        author_handle:
          type: string
        author_image:
          type: string
    ClawhubSkillDetail:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
        summary:
          type: string
        version:
          type: string
        readme:
          type: string
        files:
          type: array
          items:
            type: string
    ClawhubSkillList:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/ClawhubSkill"
        next_page_token:
          type: string
          nullable: true
    DefaultModels:
      type: object
      description: >
        Deployment-wide default model configuration, edited next to the providers that back it. Every field is a "provider/model" reference resolved against the configured providers; an empty string means that role is unset. Agents override model, model_strong, model_fast and their thinking levels field by field, while model_vision and model_embedding stay deployment-wide.

      required: [
        model,
        model_thinking,
        model_strong,
        model_strong_thinking,
        model_fast,
        model_fast_thinking,
        model_vision,
        model_embedding,
      ]
      properties:
        model:
          type: string
          maxLength: 256
        model_thinking:
          type: string
        model_strong:
          type: string
          maxLength: 256
        model_strong_thinking:
          type: string
        model_fast:
          type: string
          maxLength: 256
        model_fast_thinking:
          type: string
        model_vision:
          type: string
          maxLength: 256
        model_embedding:
          type: string
          maxLength: 256
    DefaultModelsUpdate:
      type: object
      description: >
        Update payload for the deployment default models. Every field is replaced, so send an empty string to clear a role.

      required: [
        model,
        model_thinking,
        model_strong,
        model_strong_thinking,
        model_fast,
        model_fast_thinking,
        model_vision,
        model_embedding,
      ]
      properties:
        model:
          type: string
          maxLength: 256
        model_thinking:
          type: string
        model_strong:
          type: string
          maxLength: 256
        model_strong_thinking:
          type: string
        model_fast:
          type: string
          maxLength: 256
        model_fast_thinking:
          type: string
        model_vision:
          type: string
          maxLength: 256
        model_embedding:
          type: string
          maxLength: 256
    EmailFolderList:
      type: object
      required: [folders]
      properties:
        folders:
          type: array
          items:
            type: string
    EmailAccountList:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            type: string
        default:
          type: string
    EmailEnvelope:
      type: object
      required: [uid, from, subject, date]
      properties:
        uid:
          type: integer
        message_id:
          type: string
        from:
          type: string
        from_name:
          type: string
        from_addr:
          type: string
        to:
          type: array
          items:
            type: string
        subject:
          type: string
        date:
          type: string
          format: date-time
        flags:
          type: array
          items:
            type: string
        has_attachments:
          type: boolean
        size:
          type: integer
    EmailEnvelopeList:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/EmailEnvelope"
    EmailMessage:
      allOf:
        - $ref: "#/components/schemas/EmailEnvelope"
        - type: object
          properties:
            text_body: { type: string }
            html_body: { type: string }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/EmailAttachmentInfo" }
    EmailAttachmentInfo:
      type: object
      properties:
        filename:
          type: string
        size:
          type: integer
        mime_type:
          type: string
    EmailSendRequest:
      type: object
      required: [to, subject, body]
      properties:
        to:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        cc:
          type: array
          items:
            type: string
            minLength: 1
        bcc:
          type: array
          items:
            type: string
            minLength: 1
        subject:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
        html:
          type: boolean
        from:
          type: string
        reply_to:
          type: string
        in_reply_to:
          type: string
        idempotency_key:
          type: string
          description: Optional for HTTP clients; required by the native email tool to suppress duplicate sends.
    EmailMarkRequest:
      type: object
      required: [seen]
      properties:
        seen:
          type: boolean
    EmbeddingSettings:
      type: object
      description: >
        Deployment-wide semantic-search lane configuration. The model the lane runs on and the credentials it calls with are not here: they come from the deployment default models (model_embedding) and that model's provider.

      required: [enabled, dim, normalize, active]
      properties:
        enabled:
          type: boolean
          description: >
            Whether an admin has asked for the lane. This is intent: it can be true while the lane is not running.

        dim:
          type: integer
          description: >
            Requested output dimension. 0 means the model's native width.

        normalize:
          type: boolean
        active:
          type: boolean
          readOnly: true
          description: >
            Whether the lane is actually running: enabled AND model_embedding resolves to a configured provider that has an API key. Read-only — the server derives it.

    EmbeddingSettingsUpdate:
      type: object
      description: >
        Update payload for the embedding lane. `enabled` records intent: the lane only runs once model_embedding resolves to a configured provider, and reports itself off until then.

      required: [enabled, dim, normalize]
      properties:
        enabled:
          type: boolean
        dim:
          type: integer
        normalize:
          type: boolean
    # ── Core resource ────────────────────────────────────────────────────────
    Goal:
      type: object
      description: >-
        One node in the recursive goal tree. A root (parent_id null) is a top-level goal; a child is a sub-goal created by decomposition. Completion is DERIVED: acceptance_state is a cached projection over the append-only acceptance-event ledger, never an asserted flag.
      required: [
        id,
        user_id,
        agent_id,
        root_id,
        depth,
        position,
        title,
        kind,
        priority,
        required,
        lifecycle,
        done_reason,
        acceptance_state,
        needs_attention,
        budget_bonus,
        created_at,
        updated_at,
      ]
      properties:
        id:
          type: string
        user_id:
          type: string
        agent_id:
          type: string
          description: Owner/manager agent context.
        project_id:
          type: string
          nullable: true
          description: Optional project/workspace context.
        parent_id:
          type: string
          nullable: true
          description: Parent composite id; null for a root (goal).
        root_id:
          type: string
          description: The tree's root id (= id for a root).
        depth:
          type: integer
        position:
          type: integer
        title:
          type: string
        intent:
          type: string
          description: What "done" means — the goal's acceptance target in prose.
        kind:
          type: string
          enum: [leaf, composite]
          description: A leaf is executed by a worker; a composite is decomposed into children.
        priority:
          type: string
          enum: [routine, urgent]
        required:
          type: boolean
          description: Whether this child gates its parent's acceptance.
        acceptance_contract:
          allOf: [{ $ref: "#/components/schemas/AcceptanceContract" }]
          nullable: true
          description: Composite policy tree gating acceptance; empty/absent ⇒ trivial auto-accept.
        convergence_policy:
          allOf: [{ $ref: "#/components/schemas/ConvergencePolicy" }]
          nullable: true
        review_policy:
          type: string
          enum: [none, human]
        lifecycle:
          type: string
          enum: [draft, pending, active, blocked, done]
        done_reason:
          type: string
          enum: ["", accepted, failed, cancelled]
          description: Set only when lifecycle=done.
        block_reason:
          type: string
          enum: [
            "",
            budget_exhausted,
            needs_plan_approval,
            planning_invalid,
            needs_verdict,
            env_unavailable,
            contract_conflict,
          ]
          description: Meaningful only when lifecycle=blocked.
        needs_attention:
          type: boolean
          description: Whether the goal is parked on a block only a human action can clear (verdict, plan approval, budget raise, contract edit, environment fix). Computed server-side from the canonical predicate; clients must not re-derive it from lifecycle/block_reason.
        flaky_count:
          type: integer
          description: Flaky infrastructure retries spent outside business budget.
        acceptance_state:
          type: string
          enum: [pending, passed, failed]
          description: Cached projection of the acceptance fold.
        accepted_output:
          type: object
          additionalProperties: {}
          nullable: true
          description: Frozen output, set when done_reason=accepted.
        acceptance_seq:
          type: integer
        active_attempt_id:
          type: string
          nullable: true
          description: The in-flight attempt; cleared while a human verdict is pending.
        attempt_count:
          type: integer
        budget_bonus:
          type: integer
          description: Human-granted extra convergence attempts beyond max_attempts.
        plan:
          type: object
          additionalProperties: {}
          description: >
            A composite's proposed decomposition (DecompositionContent: children + edges). Empty for a leaf or an unplanned composite. While blocked(needs_plan_approval) this holds the plan awaiting a human decision.

        planned_at:
          type: string
          format: date-time
          nullable: true
          description: Set once the composite's plan is materialized into children (the plan gate).
        context:
          type: object
          additionalProperties: {}
        dispatch_hint:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the goal is hidden from default lists.
        workflow_id:
          type: string
          nullable: true
          description: Workflow version row that instantiated this root goal.
        workflow_version:
          type: integer
          nullable: true
          description: Workflow version copied onto this run's root goal.
    GoalList:
      type: object
      required: [goals]
      properties:
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        next_page_token:
          type: string
          nullable: true
          description: Opaque pagination token; null when no further pages.
        total:
          type: integer
          description: Total goals matching the filter, ignoring pagination.
    CreateGoalRequest:
      type: object
      required: [title, agent_id]
      properties:
        title:
          type: string
        intent:
          type: string
          description: What "done" means for this goal.
        agent_id:
          type: string
        project_id:
          type: string
          description: Optional project/workspace context. Must belong to the caller and agent.
        kind:
          type: string
          enum: [leaf, composite]
          description: >-
            'leaf' (default) is a directly-executed goal; 'composite' is decomposed into children (the plan is materialized) before it can activate.
        priority:
          type: string
          enum: [routine, urgent]
        review_policy:
          type: string
          enum: [none, human]
        acceptance_contract:
          allOf: [{ $ref: "#/components/schemas/AcceptanceContract" }]
          description: Optional acceptance gate; omit for trivial auto-accept.
        convergence_policy:
          allOf: [{ $ref: "#/components/schemas/ConvergencePolicy" }]
        activate:
          type: boolean
          description: >-
            When true the new goal is activated immediately after create (direct run). Only a leaf with a satisfied plan gate can activate; a composite must be planned first, so 'activate' is ignored for it.
        idempotency_key:
          type: string
          description: Optional key; repeated creates by the same user with the same key return the existing goal.
    UpdateGoalRequest:
      type: object
      description: Partial metadata edit; omitted fields are left unchanged.
      properties:
        title:
          type: string
        intent:
          type: string
        priority:
          type: string
          enum: [routine, urgent]
        review_policy:
          type: string
          enum: [none, human]
        acceptance_contract:
          $ref: "#/components/schemas/AcceptanceContract"
        convergence_policy:
          $ref: "#/components/schemas/ConvergencePolicy"
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
    AbandonRequest:
      type: object
      description: Human give-up on a budget-exhausted block.
      properties:
        reason:
          type: string
    # ── Acceptance contract (policy tree) ────────────────────────────────────
    AcceptanceContract:
      type: object
      description: >-
        The composite policy tree of deterministic + judgment items that gates acceptance. An empty contract (no items) is the trivial auto-accept.
      properties:
        policy:
          type: string
          enum: [deterministic_then_judgment, all, any]
        items:
          type: array
          items:
            $ref: "#/components/schemas/AcceptanceItem"
    AcceptanceItem:
      type: object
      required: [id, kind]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [deterministic, judgment]
        required:
          type: boolean
          description: A non-required item is advisory and does not gate acceptance.
        command:
          type: string
          description: Deterministic check command (run in the sandbox).
        expect_exit:
          type: integer
          description: Expected exit code for a deterministic check (default 0).
        authority:
          type: string
          enum: [agent, human]
          description: Who renders a judgment verdict.
        rubric:
          type: string
          description: Agent reviewer prompt.
        prompt:
          type: string
          description: Human verdict prompt.
    ConvergencePolicy:
      type: object
      description: Bounds the rework loop and recursion depth.
      properties:
        max_attempts:
          type: integer
          description: Rework budget; exhaustion ⇒ blocked(budget_exhausted). Default 3.
        escalation:
          type: string
          enum: [block, abandon]
        max_depth:
          type: integer
          description: Recursion ceiling. Default 4.
        planner_repair_max:
          type: integer
          description: Structural planning repair turns in the same session. Default 2.
        max_concurrent:
          type: integer
          description: Per-root breadth-of-fanout cap. Default 8.
    # ── Attempts (per-attempt execution episodes) ────────────────────────────
    Attempt:
      type: object
      required: [
        id,
        goal_id,
        purpose,
        attempt_no,
        status,
        session_id,
        created_at,
        updated_at,
      ]
      properties:
        id:
          type: string
        goal_id:
          type: string
        user_id:
          type: string
        agent_id:
          type: string
          nullable: true
        executor_agent_id:
          type: string
          nullable: true
        session_id:
          type: string
        purpose:
          type: string
          enum: [execution, decomposition, review]
        attempt_no:
          type: integer
        status:
          type: string
          enum: [queued, running, submitted, interrupted, failed, cancelled]
        input_context:
          type: object
          additionalProperties: {}
        evidence:
          type: object
          additionalProperties: {}
        output:
          type: object
          additionalProperties: {}
        gaps:
          type: object
          additionalProperties: {}
        error:
          type: string
        failure_class:
          type: string
          enum: ["", model, environment, contract, flaky]
          description: Responsibility class for failed or interrupted attempts.
        repair_rounds:
          type: integer
          description: Structural decomposition repair turns spent inside this attempt.
        worker_id:
          type: string
        heartbeat_at:
          type: string
          format: date-time
          nullable: true
        lease_expires_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AttemptList:
      type: object
      required: [attempts]
      properties:
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
    GoalHealthCountBucket:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer
          format: int64
    GoalHealthRatioBucket:
      type: object
      required: [key, count, ratio]
      properties:
        key:
          type: string
        count:
          type: integer
          format: int64
        ratio:
          type: number
          format: double
    GoalHealthAttemptPurpose:
      type: object
      required: [
        purpose,
        total,
        succeeded,
        success_rate,
        average_retries,
        max_retries,
      ]
      properties:
        purpose:
          type: string
          enum: [decomposition, execution, review]
        total:
          type: integer
          format: int64
        succeeded:
          type: integer
          format: int64
        success_rate:
          type: number
          format: double
        average_retries:
          type: number
          format: double
        max_retries:
          type: integer
          format: int64
    GoalHealthAcceptanceEvents:
      type: object
      required: [total, passed, failed, pass_rate]
      properties:
        total:
          type: integer
          format: int64
        passed:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        pass_rate:
          type: number
          format: double
    GoalHealthDecompositionQuality:
      type: object
      required: [
        first_round_total,
        first_round_succeeded,
        first_round_success_rate,
        average_repair_rounds,
        redecomposition_counts,
      ]
      properties:
        first_round_total:
          type: integer
          format: int64
        first_round_succeeded:
          type: integer
          format: int64
        first_round_success_rate:
          type: number
          format: double
        average_repair_rounds:
          type: number
          format: double
        redecomposition_counts:
          type: array
          items:
            $ref: "#/components/schemas/GoalHealthCountBucket"
    GoalHealthBudgetAttribution:
      type: object
      required: [
        model_budget_attempts,
        class_counts,
        flaky_dominant_blocked_goals,
      ]
      properties:
        model_budget_attempts:
          type: integer
          format: int64
          description: Execution failures charged to business budget (failure_class=model).
        class_counts:
          type: array
          items:
            $ref: "#/components/schemas/GoalHealthRatioBucket"
        flaky_dominant_blocked_goals:
          type: integer
          format: int64
          description: Blocked goals where flaky execution failures are at least half of non-model failures.
    GoalHealthAttemptLatency:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [decomposition, execution, review]
        p50_ms:
          type: number
          format: double
          nullable: true
        p95_ms:
          type: number
          format: double
          nullable: true
    GoalHealthLatency:
      type: object
      required: [attempts, goal_e2e]
      properties:
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/GoalHealthAttemptLatency"
        goal_e2e:
          type: object
          required: [p50_ms, p95_ms]
          properties:
            p50_ms:
              type: number
              format: double
              nullable: true
            p95_ms:
              type: number
              format: double
              nullable: true
    GoalHealthReport:
      type: object
      required: [
        since_at,
        until_at,
        total_goals,
        lifecycle_counts,
        blocked_reason_counts,
        attempt_purposes,
        failure_class_counts,
        acceptance_events,
        decomposition_quality,
        budget_attribution,
        latency,
      ]
      properties:
        since_at:
          type: string
          format: date-time
        until_at:
          type: string
          format: date-time
        user_id:
          type: string
          nullable: true
        agent_id:
          type: string
          nullable: true
        total_goals:
          type: integer
          format: int64
        lifecycle_counts:
          type: array
          items:
            $ref: "#/components/schemas/GoalHealthCountBucket"
        blocked_reason_counts:
          type: array
          items:
            $ref: "#/components/schemas/GoalHealthCountBucket"
        attempt_purposes:
          type: array
          items:
            $ref: "#/components/schemas/GoalHealthAttemptPurpose"
        failure_class_counts:
          type: array
          items:
            $ref: "#/components/schemas/GoalHealthCountBucket"
        acceptance_events:
          $ref: "#/components/schemas/GoalHealthAcceptanceEvents"
        decomposition_quality:
          $ref: "#/components/schemas/GoalHealthDecompositionQuality"
        budget_attribution:
          $ref: "#/components/schemas/GoalHealthBudgetAttribution"
        latency:
          $ref: "#/components/schemas/GoalHealthLatency"
    # ── Acceptance events (the append-only ledger) ───────────────────────────
    AcceptanceEvent:
      type: object
      required: [
        id,
        goal_id,
        seq,
        item_id,
        item_kind,
        result,
        authority,
        created_at,
      ]
      properties:
        id:
          type: string
        goal_id:
          type: string
        attempt_id:
          type: string
          nullable: true
        seq:
          type: integer
        item_id:
          type: string
        item_kind:
          type: string
          enum: [deterministic, judgment]
        result:
          type: string
          enum: [pass, fail]
        command:
          type: string
        exit_code:
          type: integer
          nullable: true
        cache_key:
          type: string
        authority:
          type: string
          enum: [system, agent, human]
        reviewer_user_id:
          type: string
          nullable: true
        reviewer_attempt_id:
          type: string
          nullable: true
        rationale:
          type: string
        scope:
          type: string
        scope_hash:
          type: string
        detail:
          type: string
        created_at:
          type: string
          format: date-time
    AcceptanceEventList:
      type: object
      required: [acceptance_events]
      properties:
        acceptance_events:
          type: array
          items:
            $ref: "#/components/schemas/AcceptanceEvent"
    GoalTimelineEvent:
      type: object
      required: [id, goal_id, event_type, payload, created_at]
      properties:
        id:
          type: string
        goal_id:
          type: string
        attempt_id:
          type: string
          nullable: true
        event_type:
          type: string
          enum: [
            plan_submitted,
            attempt_started,
            attempt_finished,
            acceptance_recorded,
            lifecycle_changed,
            human_message,
          ]
        payload:
          type: object
          additionalProperties: {}
        created_at:
          type: string
          format: date-time
    GoalTimeline:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/GoalTimelineEvent"
        next_page_token:
          type: string
          nullable: true
          description: Opaque pagination token; null when no further pages.
    GoalTimelineMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Human instruction appended to the goal timeline.
    VerdictRequest:
      type: object
      description: A human judgment-as-evidence verdict against a contract item; re-folds acceptance.
      required: [item_id, result]
      properties:
        item_id:
          type: string
        result:
          type: string
          enum: [pass, fail]
        rationale:
          type: string
        scope:
          type: string
        scope_hash:
          type: string
          description: The accepted-output/artifact hash the verdict covers (staleness anchor).
    # ── Edges (sibling dependencies) ─────────────────────────────────────────
    Edge:
      type: object
      required: [goal_id, upstream_id, edge_kind, on_failure, created_at]
      properties:
        goal_id:
          type: string
        upstream_id:
          type: string
        edge_kind:
          type: string
          enum: [hard, soft]
        on_failure:
          type: string
          enum: [block, fail, ignore]
        waived_at:
          type: string
          format: date-time
          nullable: true
        waived_by_user:
          type: string
          nullable: true
        waiver_reason:
          type: string
        created_at:
          type: string
          format: date-time
    EdgeList:
      type: object
      required: [edges]
      properties:
        edges:
          type: array
          items:
            $ref: "#/components/schemas/Edge"
    AddEdgeRequest:
      type: object
      required: [upstream_id]
      properties:
        upstream_id:
          type: string
        kind:
          type: string
          enum: [hard, soft]
          description: Default 'hard'.
        on_failure:
          type: string
          enum: [block, fail, ignore]
          description: Default 'block'.
    WaiveRequest:
      type: object
      properties:
        reason:
          type: string
    # ── Decomposition plan (a composite's proposed children + edges) ──────────
    DecompositionContent:
      type: object
      description: A composite's proposed children + sibling edges (its plan).
      required: [children]
      properties:
        children:
          type: array
          items:
            $ref: "#/components/schemas/ProposedChild"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/ProposedEdge"
    ProposedChild:
      type: object
      required: [key, title]
      properties:
        key:
          type: string
          description: Stable id within the plan; the materialize idempotency anchor.
        title:
          type: string
        intent:
          type: string
        kind:
          type: string
          enum: [leaf, composite]
        required:
          type: boolean
        acceptance_contract:
          $ref: "#/components/schemas/AcceptanceContract"
        convergence_policy:
          $ref: "#/components/schemas/ConvergencePolicy"
        review_policy:
          type: string
          enum: [none, human]
    ProposedEdge:
      type: object
