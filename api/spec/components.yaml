          type: string
          enum: [hard, soft]
        on_failure:
          type: string
          enum: [block, fail, ignore]
    # ── Agent-facing goal_control tool inputs ────────────────────────────────
    GoalControlExecuteInput:
      type: object
      properties:
        action:
          type: string
          enum: [submit, fail]
          description: Which terminal action to take.
        summary:
          type: string
          description: "submit: handoff summary describing what you produced (required for child goals)."
        artifacts:
          type: array
          description: "submit: hash-addressed artifact refs (diffs/files/stdout)."
        output:
          type: object
          description: "submit: structured result the acceptance contract evaluates."
        notes:
          type: object
          description: "submit: free-form evidence notes."
        reason:
          type: string
          description: "fail: error message."
        blocked_by:
          type: string
          enum: ["", env_unavailable, contract_conflict]
          description: "fail: optional structured blocker when the contract is impossible or the environment is unavailable."
      required: [action]
    GoalControlDecomposeInput:
      type: object
      properties:
        action:
          type: string
          enum: [decompose, fail]
          description: Which terminal action to take.
        summary:
          type: string
          description: "decompose: one-line description of the plan."
        decomposition:
          allOf: [{ $ref: "#/components/schemas/DecompositionContent" }]
          description: "decompose: the proposed plan as children + sibling edges."
        reason:
          type: string
          description: "fail: error message."
        blocked_by:
          type: string
          enum: ["", env_unavailable, contract_conflict]
          description: "fail: optional structured blocker when the contract is impossible or the environment is unavailable."
      required: [action]
    GoalControlReviewInput:
      type: object
      properties:
        action:
          type: string
          enum: [verdict, fail]
          description: Which terminal action to take.
        summary:
          type: string
          description: "verdict: one-line summary of the review."
        verdicts:
          type: array
          description: "verdict: one entry per required item being reviewed."
          items:
            $ref: "#/components/schemas/GoalControlReviewVerdict"
        reason:
          type: string
          description: "fail: why the output cannot be judged."
        blocked_by:
          type: string
          enum: ["", env_unavailable, contract_conflict]
          description: "fail: optional structured blocker when the contract is impossible or the environment is unavailable."
      required: [action]
    GoalControlReviewVerdict:
      type: object
      properties:
        item_id:
          type: string
          description: The acceptance item id this verdict answers.
        pass:
          type: boolean
          description: true if the output satisfies the item.
        rationale:
          type: string
          description: Why it passes or fails; a fail rationale feeds the next attempt.
      required: [item_id, pass]
    DecisionRequest:
      type: object
      description: A plan decision (reject) note.
      properties:
        reason:
          type: string
