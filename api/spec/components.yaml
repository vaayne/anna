          type: string
        tool_name:
          type: string
        is_error:
          type: boolean
        # Why is_error is set. Absent on messages written before the split and
        # on non-error results; absent is "unclassified", never "command_nonzero".
        error_kind:
          type: string
          enum: [tool_error, command_nonzero, command_timeout]
        references:
          type: array
          items:
            $ref: "#/components/schemas/SessionMessageReference"
        # Present only on a Code Mode outer tool result. This host-generated
        # audit is not provider-visible and intentionally omits arguments and
        # child result content.
        child_calls:
          type: array
