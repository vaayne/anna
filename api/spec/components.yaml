    Webhook:
      type: object
      description: >-
        A personal invocation capability. The URL is disclosed only by Create and Rotate and is never returned by stable reads.
      required: [
        id,
        user_id,
        name,
        agent_id,
        provider,
        is_enabled,
        wait_timeout_seconds,
        max_run_timeout_seconds,
        token_last4,
        etag,
        created_at,
        updated_at,
      ]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Output-only UUID v7 resource ID.
        user_id:
          type: string
          format: uuid
          readOnly: true
          description: Output-only authenticated owner ID.
        name:
          type: string
          minLength: 1
          description: Human-readable webhook name.
        agent_id:
          type: string
          minLength: 1
          description: Agent the owner is authorized to invoke.
        provider:
          type: string
          enum: [generic]
          description: Immutable invocation provider selected at creation.
        is_enabled:
          type: boolean
          description: Whether ingress admission is enabled.
        wait_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600
          description: Maximum synchronous reply wait in seconds.
        max_run_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: Maximum admitted agent run duration in seconds.
        token_last4:
          type: string
          readOnly: true
          description: Output-only final four token characters for identification.
        etag:
          type: string
          readOnly: true
          description: Output-only opaque rotation precondition.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        rotated_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        url:
          type: string
          readOnly: true
          description: One-time capability URL, returned only by Create and Rotate.
    WebhookList:
      type: object
      required: [webhooks]
      properties:
        webhooks:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
        next_page_token:
          type: string
          nullable: true
    CreateWebhookRequest:
      type: object
      required: [name, agent_id]
      properties:
        name:
          type: string
          minLength: 1
        agent_id:
          type: string
          minLength: 1
          description: Caller-accessible Agent ID.
        provider:
          type: string
          enum: [generic]
          default: generic
          description: Immutable invocation provider; defaults to generic.
        is_enabled:
          type: boolean
          default: true
        wait_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600
          default: 60
        max_run_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 300
    UpdateWebhookRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        agent_id:
          type: string
          minLength: 1
          description: Caller-accessible Agent ID.
        is_enabled:
          type: boolean
        wait_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600
        max_run_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
    RotateWebhookRequest:
      type: object
      required: [etag]
      properties:
        etag:
          type: string
    WorkflowInputSpec:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Input placeholder name used as {{inputs.name}}.
        description:
          type: string
        required:
          type: boolean
          default: false
        default:
          type: string
          description: Default value used when the caller omits this input.
    Workflow:
      type: object
      description: >-
        A named, immutable workflow version created by freezing a completed composite goal's decomposition plan. Instantiating a workflow creates a fresh goal tree without invoking the planner for frozen nodes.
      required: [
        id,
        owner_kind,
        name,
        version,
        intent,
        inputs,
        payload_format,
        payload,
        fully_frozen,
        created_at,
        updated_at,
      ]
      properties:
        id:
          type: string
        owner_kind:
          type: string
          enum: [user, agent, system]
        user_id:
          type: string
          nullable: true
        agent_id:
          type: string
          nullable: true
        name:
          type: string
        version:
          type: integer
        intent:
          type: string
        acceptance_contract:
          type: object
          additionalProperties: {}
          nullable: true
        convergence_policy:
          type: object
          additionalProperties: {}
          nullable: true
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowInputSpec"
        payload_format:
          type: string
          enum: [frozen/v0]
        payload:
          type: object
          additionalProperties: {}
          description: Frozen plan payload; read-only internal format for UI inspection.
        fully_frozen:
          type: boolean
          description: True when every composite node has a frozen sub-plan.
        source_goal_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkflowList:
      type: object
      required: [workflows]
      properties:
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
    WorkflowRun:
      type: object
      required: [
        id,
        workflow_id,
        workflow_version,
        idempotency_key,
        status,
        inputs,
        plan_hash,
        created_at,
        updated_at,
      ]
      properties:
        id:
          type: string
        workflow_id:
          type: string
        workflow_version:
          type: integer
        idempotency_key:
          type: string
        root_goal_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [claimed, materializing, done, failed]
          description: >-
            Instantiation status only. The outcome of the run is the root goal's state (root_lifecycle and friends), not this field.
        root_lifecycle:
          type: string
          nullable: true
          description: Root goal lifecycle; null until the root goal exists.
        root_block_reason:
          type: string
          nullable: true
        root_done_reason:
          type: string
          nullable: true
        inputs:
          type: object
          additionalProperties:
            type: string
        plan_hash:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkflowRunList:
      type: object
      required: [runs, total]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRun"
        total:
          type: integer
          description: Total workflow runs matching this workflow.
        next_page_token:
          type: string
          nullable: true
    SaveGoalAsWorkflowRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowInputSpec"
    InstantiateWorkflowRequest:
      type: object
      properties:
        inputs:
          type: object
          additionalProperties:
            type: string
        idempotency_key:
          type: string
          description: >-
            Optional idempotency key. When omitted, the server generates a UUID, so retries must provide their own key to be idempotent.
  responses:
    Unauthorized:
      description: missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: resource has been permanently removed or is no longer available
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: request conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: upstream provider or catalog failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: service is not configured or temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
