openapi: 3.0.3
info:
  title: MCP Components
  version: "1"
paths: {}
components:
  schemas:
    MCPOAuthStart:
      type: object
      required: [authorization_url, flow_id, expires_at]
      properties:
        authorization_url: {
          type: string,
          description: Open this in a browser to authorize.,
        }
        flow_id: { type: string }
        expires_at: { type: string, format: date-time }

    MCPTool:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        input_schema:
          type: object
          additionalProperties: true
        annotations:
          type: object
          additionalProperties: true

    MCPRegistryServer:
      type: object
      required: [source, id, name, url, transport, auth]
      properties:
        source:
          type: string
          description: Registry source this row came from (currently always official).
        id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: string }
        url:
          type: string
          description: Connection URL of the first streamable-http remote.
        transport:
          type: string
          enum: [streamable_http]
        auth:
          type: string
          enum: [none, bearer, unsupported]
          description: >-
            Install-time classification from the advertised headers. bearer
            means a single Authorization: Bearer header; unsupported means the
            entry needs manual header setup. OAuth is not advertised by the
            registry and is discovered by the probe after install.
        headers:
          type: array
          description: Install-time header requirements advertised by the registry.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              template:
                type: string
                description: 'Raw value template, e.g. "Bearer {smithery_api_key}"; never a secret itself.'
              required: { type: boolean }
              is_secret: { type: boolean }
              description: { type: string }
        repository: { type: string }

    MCPRegistryServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/MCPRegistryServer" }
        next_page_token:
          type: string
          nullable: true
