paths:
  /api/plugins:
    get:
      tags: [plugins]
      summary: List plugins visible to the caller
      operationId: listPlugins
      x-agent-tool: {
        tool: "settings_plugin",
        action: "list",
        omit: [page_size, page_token],
      }
      parameters:
        - {
            name: page_size,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - {
            name: page_token,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    post:
      tags: [plugins]
      summary: Create a custom plugin and its initial configuration
      operationId: createPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreatePluginRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CreatePluginResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{kind}/{name}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Get a visible plugin definition
      operationId: getPlugin
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginDefinition",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    patch:
      tags: [plugins]
      summary: Update custom plugin presentation metadata
      operationId: updatePlugin
      # The core settings tool keeps its established kind/name contract. Its
      # handler owns the enable/disable action while this resource route owns
      # definition metadata; omit the HTTP body from the model-facing tool.
      x-agent-tool:
        - {
            tool: "settings_plugin",
            action: "enable",
            fixed: { enabled: true },
            body: false,
          }
        - {
            tool: "settings_plugin",
            action: "disable",
            fixed: { enabled: false },
            body: false,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdatePluginRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginDefinition",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    delete:
      tags: [plugins]
      summary: Delete a custom plugin definition
      operationId: deletePlugin
      parameters:
        - {
            name: expected_revision,
            in: query,
            required: true,
            schema: { type: integer, format: int64, minimum: 1 },
          }
      responses:
        "204": { description: deleted }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{kind}/{name}/configs:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: List configurations owned by the caller
      operationId: listPluginConfigs
      parameters:
        - name: scope
          in: query
          required: false
          schema: {
            type: string,
            enum: [system, system_agent, user, user_agent],
            default: user,
          }
        - {
            name: agent_id,
            in: query,
            required: false,
            schema: { type: string },
          }
        - {
            name: page_size,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 500, default: 20 },
          }
        - {
            name: page_token,
            in: query,
            required: false,
            schema: { type: string },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginConfigList",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    post:
      tags: [plugins]
      summary: Create a plugin configuration in one scope
      operationId: createPluginConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/CreatePluginConfigRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginConfig",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{kind}/{name}/configs/{config_id}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: config_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Get an owned plugin configuration
      operationId: getPluginConfig
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginConfig",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    patch:
      tags: [plugins]
      summary: Partially update an owned plugin configuration
      operationId: updatePluginConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/UpdatePluginConfigRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginConfig",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }
    delete:
      tags: [plugins]
      summary: Delete an owned plugin configuration
      operationId: deletePluginConfig
      parameters:
        - {
            name: expected_revision,
            in: query,
            required: true,
            schema: { type: integer, format: int64, minimum: 1 },
          }
      responses:
        "204": { description: deleted }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{kind}/{name}/configs/{config_id}/reset:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: config_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [plugins]
      summary: Reset a builtin system configuration to its shipped default
      operationId: resetPluginConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/RevisionRequest",
            }
      responses:
        "200":
          description: reset
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginConfig",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{kind}/{name}/effective:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      summary: Resolve a plugin for the caller and an authorized Agent
      operationId: getPluginEffective
      parameters:
        - {
            name: agent_id,
            in: query,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          description: effective state
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginEffective",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{kind}/{name}/configs/{config_id}/probe:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: config_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [plugins]
      summary: Probe a plugin configuration through its backend
      operationId: probePluginConfig
      responses:
        "200": { description: probe result }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{kind}/{name}/configs/{config_id}/oauth/start:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: config_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [plugins]
      summary: Begin OAuth authorization for an owned MCP plugin configuration
      operationId: startPluginConfigOAuth
      responses:
        "201":
          description: authorization started
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/MCPOAuthStart",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/plugins/{kind}/{name}/configs/{config_id}/oauth/disconnect:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: config_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [plugins]
      summary: Remove OAuth authorization for an owned MCP plugin configuration
      operationId: disconnectPluginConfigOAuth
      responses:
        "200":
          description: disconnected
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PluginConfig",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }
        "503": {
          $ref: "../../components.yaml#/components/responses/ServiceUnavailable",
        }

  /api/cli-tools/registry:
    get:
      tags: [plugins]
      summary: Search the mise tool registry (admin only)
      operationId: searchCliToolRegistry
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, default: 30 },
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CliToolRegistryResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
  /api/cli-tools/latest:
    get:
      tags: [plugins]
      summary: Resolve the latest version for a mise tool (admin only)
      operationId: getCliToolLatest
      parameters:
        - { name: tool, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/CliToolLatestResponse",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
