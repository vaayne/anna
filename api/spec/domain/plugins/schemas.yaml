openapi: 3.0.3
info:
  title: Plugins Components
  version: "1"
paths: {}
components:
  schemas:
    PluginDefinition:
      type: object
      additionalProperties: false
      required: [
        id,
        namespace,
        display_name,
        backend,
        is_builtin,
        is_default_enabled,
        spec,
        revision,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string }
        namespace: { type: string }
        display_name: { type: string }
        backend: { type: string, enum: [cli, mcp, go] }
        is_builtin: { type: boolean, readOnly: true }
        is_default_enabled: { type: boolean, readOnly: true }
        spec:
          type: object
          additionalProperties: true
          description: Safe non-secret resource summaries. Private endpoints and credentials are omitted.
        revision: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    PluginList:
      type: object
      required: [plugins, next_page_token]
      properties:
        plugins: {
          type: array,
          items: { $ref: "#/components/schemas/PluginDefinition" },
        }
        next_page_token: { type: string, nullable: true }
    PluginConfig:
      type: object
      additionalProperties: false
      required: [
        id,
        plugin_id,
        scope,
        is_enabled,
        backend_summary,
        revision,
        created_at,
        updated_at,
      ]
      properties:
        id: { type: string, format: uuid }
        plugin_id: { type: string }
        scope: { type: string, enum: [system, system_agent, user, user_agent] }
        user_id: { type: string, format: uuid, readOnly: true }
        agent_id: { type: string }
        is_enabled: { type: boolean, nullable: true }
        backend_summary:
          oneOf:
            - $ref: "#/components/schemas/PluginCLIBackendSummary"
            - $ref: "#/components/schemas/PluginMCPBackendSummary"
            - $ref: "#/components/schemas/PluginGoBackendSummary"
          discriminator:
            propertyName: backend
            mapping:
              cli: "#/components/schemas/PluginCLIBackendSummary"
              mcp: "#/components/schemas/PluginMCPBackendSummary"
              go: "#/components/schemas/PluginGoBackendSummary"
          description: Typed non-secret backend summary. Raw backend payload and credential references are never returned.
        revision: { type: integer, format: int64, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    PluginCLIBackendSummary:
      type: object
      additionalProperties: false
      required: [
        backend,
        binaries,
        skills,
        session_env,
        oauth_provider_configured,
      ]
      properties:
        backend: { type: string, enum: [cli] }
        binaries:
          type: array
          items: { $ref: "#/components/schemas/PluginCLIBackendBinarySummary" }
        skills:
          type: array
          items: { $ref: "#/components/schemas/PluginCLIBackendSkillSummary" }
        session_env:
          type: array
          items: {
            $ref: "#/components/schemas/PluginCLIBackendSessionEnvSummary",
          }
        oauth_provider_configured: { type: boolean }
    PluginCLIBackendBinarySummary:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string }
        version: { type: string }
    PluginCLIBackendSkillSummary:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
    PluginCLIBackendSessionEnvSummary:
      type: object
      additionalProperties: false
      required: [env_var, source, required]
      properties:
        env_var: { type: string }
        source: { type: string }
        required: { type: boolean }
    PluginMCPBackendSummary:
      type: object
      additionalProperties: false
      required: [
        backend,
        transport,
        auth_type,
        credential_mode,
        endpoint_configured,
        bearer_configured,
        oauth_client_id_configured,
        oauth_client_secret_configured,
      ]
      properties:
        backend: { type: string, enum: [mcp] }
        transport: { type: string, enum: [streamable_http, sse] }
        auth_type: { type: string, enum: [none, bearer, oauth] }
        credential_mode: { type: string, enum: [shared, per_user] }
        endpoint_configured: { type: boolean }
        bearer_configured: { type: boolean }
        oauth_client_id_configured: { type: boolean }
        oauth_client_secret_configured: { type: boolean }
    PluginGoBackendSummary:
      type: object
      additionalProperties: false
      required: [backend, configured]
      properties:
        backend: { type: string, enum: [go] }
        kind: { type: string, enum: [channel], nullable: true }
        configured: { type: boolean }
    PluginConfigList:
      type: object
      required: [configs, next_page_token]
      properties:
        configs: {
          type: array,
          items: { $ref: "#/components/schemas/PluginConfig" },
        }
        next_page_token: { type: string, nullable: true }
    PluginEffective:
      type: object
      additionalProperties: false
      required: [
        plugin_id,
        namespace,
        config_id,
        source_scope,
        is_effectively_enabled,
        availability_reason,
        readiness,
      ]
      properties:
        plugin_id: { type: string }
        namespace: { type: string }
        config_id: { type: string, nullable: true }
        source_scope: { type: string, nullable: true }
        is_effectively_enabled: { type: boolean }
        availability_reason: { type: string }
        readiness: { type: string, enum: [unknown, ready, unavailable] }
    PluginConfigInput:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: { type: string, enum: [system, system_agent, user, user_agent] }
        agent_id: { type: string }
        is_enabled: { type: boolean, nullable: true }
        config: { type: object, nullable: true, additionalProperties: true }
        credentials:
          type: object
          nullable: true
          writeOnly: true
          additionalProperties: true
          description: Write-only credential material.
    CreatePluginConfigRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: { type: string, enum: [system, system_agent, user, user_agent] }
        agent_id: { type: string }
        is_enabled: { type: boolean, nullable: true }
        config: { type: object, nullable: true, additionalProperties: true }
        credentials:
          type: object
          nullable: true
          writeOnly: true
          additionalProperties: true
          description: Write-only credential material.
    CreatePluginRequest:
      type: object
      additionalProperties: false
      required: [
        display_name,
        namespace,
        backend,
        definition_spec,
        initial_config,
      ]
      properties:
        display_name: { type: string }
        namespace: { type: string }
        backend: { type: string, enum: [cli, mcp] }
        definition_spec: { type: object, additionalProperties: true }
        initial_config: { $ref: "#/components/schemas/PluginConfigInput" }
    CreatePluginResponse:
      type: object
      additionalProperties: false
      required: [plugin, config]
      properties:
        plugin: { $ref: "#/components/schemas/PluginDefinition" }
        config: { $ref: "#/components/schemas/PluginConfig" }
    UpdatePluginRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
        display_name: { type: string }
        description: { type: string, nullable: true }
    UpdatePluginConfigRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
        is_enabled: { type: boolean, nullable: true }
        config: { type: object, nullable: true, additionalProperties: true }
        reset_fields: { type: array, items: { type: string } }
        binary_versions:
          type: object
          writeOnly: true
          additionalProperties: { type: string, minLength: 1 }
          description: Write-only CLI binary version edits keyed by definition resource name.
        credentials:
          type: object
          nullable: true
          writeOnly: true
          additionalProperties: true
          description: Write-only credential material.
    RevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
    CliToolRegistryItem:
      type: object
      properties:
        name: { type: string }
        backends: { type: array, items: { type: string } }
    CliToolRegistryResponse:
      type: object
      required: [tools]
      properties:
        tools: {
          type: array,
          items: { $ref: "#/components/schemas/CliToolRegistryItem" },
        }
    CliToolLatestResponse:
      type: object
      required: [version]
      properties:
        version: { type: string }
