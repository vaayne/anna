openapi: 3.0.3
info:
  title: Channels Components
  version: "1"
paths: {}
components:
  schemas:
    Channel:
      type: object
      required: [id, name, type, is_active, config]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        agent_id: { type: string }
        is_active:
          type: boolean
          description: Whether this channel instance accepts and delivers messages.
        config:
          type: string
          description: "JSON string of the channel config"

    ChannelList:
      type: object
      required: [channels]
      properties:
        channels: {
          type: array,
          items: { $ref: "#/components/schemas/Channel" },
        }

    FeishuChat:
      type: object
      description: A group chat the configured Feishu bot currently belongs to.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    FeishuChatList:
      type: object
      required: [chats, next_page_token]
      properties:
        chats:
          type: array
          items: { $ref: "#/components/schemas/FeishuChat" }
        next_page_token: { type: string, nullable: true }

    PublicChannel:
      type: object
      required: [id, type, label, is_active]
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        agent_id: { type: string }
        agent_name: { type: string }
        is_active:
          type: boolean
          description: Whether this channel instance accepts and delivers messages.

    PublicChannelList:
      type: object
      required: [channels]
      properties:
        channels: {
          type: array,
          items: { $ref: "#/components/schemas/PublicChannel" },
        }

    ChannelWriteRequest:
      type: object
      properties:
        id:
          type: string
          description: >-
            Channel id. Optional on create — the server mints an independent
            uuid when it is omitted. Ignored on update; the path id wins.
        name:
          type: string
          description: >-
            Display name. Optional on create — the server defaults it to
            "{type}-{random suffix}" when it is omitted.
        type: { type: string, nullable: true }
        agent_id: { type: string, nullable: true }
        is_active:
          type: boolean
          nullable: true
          description: Set whether this channel instance accepts and delivers messages.
        config:
          type: string
          description: >-
            JSON string of the channel config. Omit to keep the current config;
            pass an object to replace it.

    BindChannelRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
          description: >-
            Agent to bind this channel to. An empty string unbinds the channel.

    FeishuRegistrationInitRequest:
      type: object
      properties:
        brand:
          type: string
          enum: [feishu, lark]
          default: feishu

    FeishuRegistrationInit:
      type: object
      required: [supported_auth_methods]
      properties:
        supported_auth_methods:
          type: array
          items: { type: string }

    FeishuRegistrationBeginRequest:
      type: object
      properties:
        brand:
          type: string
          enum: [feishu, lark]
          default: feishu
        auto_provision:
          type: boolean
          default: false
          description: Include the contact scopes required for Feishu user auto-provisioning.
        app_id:
          type: string
          description: >-
            Existing Feishu app id to update. Omit this to create a new app.

    FeishuRegistrationBegin:
      type: object
      required: [
        device_code,
        verification_uri_complete,
        qr_url,
        interval,
        expires_in,
      ]
      properties:
        device_code: { type: string }
        user_code: { type: string }
        verification_uri: { type: string }
        verification_uri_complete: { type: string }
        qr_url: { type: string }
        interval: { type: integer }
        expires_in: { type: integer }

    FeishuRegistrationPollRequest:
      type: object
      required: [device_code, agent_id]
      properties:
        device_code: { type: string }
        channel_id:
          type: string
          description: >-
            Optional. The server mints a uuid for the channel it creates when
            this is omitted.
        agent_id: { type: string }
        name: { type: string }
        brand:
          type: string
          enum: [feishu, lark]
          default: feishu
        is_active:
          type: boolean
          default: true
        config:
          type: object
          additionalProperties: true

    FeishuRegistrationPoll:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, slow_down, created]
        interval: { type: integer }
        tenant_brand: { type: string }
        channel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Channel"

    WeixinRegistrationBeginRequest:
      type: object
      properties:
        channel_id:
          type: string
          description: >-
            Existing Weixin channel instance to update. Omit this to mint a new
            instance id; the returned id must be sent with every poll.

    WeixinRegistrationBegin:
      type: object
      required: [channel_id, qrcode, qr_image_url, poll_interval]
      properties:
        channel_id:
          type: string
          description: Exact channel instance id to use for this registration.
        qrcode: { type: string }
        qr_image_url: { type: string }
        poll_interval: { type: integer }

    WeixinRegistrationPollRequest:
      type: object
      required: [qrcode, channel_id, agent_id]
      properties:
        qrcode: { type: string }
        channel_id:
          type: string
          description: >-
            Exact channel instance id returned by begin. The server verifies
            that it is a Weixin row before saving credentials.
        agent_id: { type: string }
        name: { type: string }
        config:
          type: object
          additionalProperties: true

    WeixinRegistrationPoll:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: >-
            Registration status. "created" is synthesized by Stella once
            credentials are saved; all other values are passed through verbatim
            from the iLink scan status (e.g. wait, scaned, expired) and are not
            an exhaustive set.
        poll_interval: { type: integer }
        channel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Channel"

    WeixinQRCode:
      type: object
      properties:
        qrcode: { type: string }
        qrcode_img_content: { type: string }

    WeixinQRStatus:
      type: object
      properties:
        status: { type: string }
        bot_token: { type: string }
        ilink_bot_id: { type: string }
        ilink_user_id: { type: string }
        baseurl: { type: string }
