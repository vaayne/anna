paths:
  /api/channels/public:
    get:
      tags: [channels]
      summary: List public channels (any authenticated user)
      operationId: listPublicChannels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PublicChannelList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }

  /api/channels:
    get:
      tags: [channels]
      summary: List channels the caller may manage
      operationId: listChannels
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/ChannelList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
    post:
      tags: [channels]
      summary: Create a channel (admin, or the owner of the bound agent)
      description: >-
        `type` is required. `id` is optional: the server mints an independent
        uuid when it is omitted. `name` is optional and defaults to
        "{type}-{random suffix}".
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/ChannelWriteRequest",
            }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Channel",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/channels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [channels]
      summary: Get a channel the caller may manage
      operationId: getChannel
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Channel",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    patch:
      tags: [channels]
      summary: Update a channel the caller may manage
      operationId: updateChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/ChannelWriteRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Channel",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
    delete:
      tags: [channels]
      summary: Delete a channel the caller may manage
      operationId: deleteChannel
      responses:
        "204":
          description: deleted
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../components.yaml#/components/responses/Conflict" }

  /api/channels/{id}/bind:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [channels]
      summary: Bind or unbind a channel's agent (any authenticated user)
      description: >-
        Binds the channel to an agent the caller may use, or unbinds it when
        agent_id is empty. Unlike updateChannel this never touches the channel
        config, and it returns the secret-free public channel projection.
      operationId: bindChannelAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/BindChannelRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/PublicChannel",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }

  /api/channels/{id}/feishu/chats:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [channels]
      summary: List group chats currently joined by a Feishu channel bot
      description: >-
        Reads the running Feishu channel directly. The channel instance must be active
        and connected; this endpoint never persists a group directory.
      operationId: listFeishuChannelChats
      parameters:
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - { name: page_token, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeishuChatList",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../components.yaml#/components/responses/NotFound" }
        "409": {
          $ref: "../../components.yaml#/components/responses/Conflict",
        }
        "502": {
          $ref: "../../components.yaml#/components/responses/BadGateway",
        }

  /api/channels/feishu/register/init:
    post:
      tags: [channels]
      summary: Initialize Feishu PersonalAgent registration (admin only)
      operationId: initFeishuRegistration
      requestBody:
        required: false
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/FeishuRegistrationInitRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeishuRegistrationInit",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502":
          description: upstream error from Feishu registration API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/feishu/register/begin:
    post:
      tags: [channels]
      summary: Begin Feishu PersonalAgent registration (admin only)
      operationId: beginFeishuRegistration
      requestBody:
        required: false
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/FeishuRegistrationBeginRequest",
            }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeishuRegistrationBegin",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502":
          description: upstream error from Feishu registration API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/feishu/register/poll:
    post:
      tags: [channels]
      summary: Poll Feishu PersonalAgent registration and create a channel (admin only)
      operationId: pollFeishuRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/FeishuRegistrationPollRequest",
            }
      responses:
        "200":
          description: pending or created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/FeishuRegistrationPoll",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502":
          description: upstream error from Feishu registration API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/weixin/register/qr:
    post:
      tags: [channels]
      summary: Begin WeChat iLink bot registration (admin only)
      operationId: beginWeixinRegistration
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "../../components.yaml#/components/schemas/WeixinRegistrationBeginRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WeixinRegistrationBegin",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502":
          description: upstream error from iLink API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/weixin/register/poll:
    post:
      tags: [channels]
      summary: Poll WeChat iLink bot registration and create a channel (admin only)
      operationId: pollWeixinRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema: {
              $ref: "../../components.yaml#/components/schemas/WeixinRegistrationPollRequest",
            }
      responses:
        "200":
          description: pending or created
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WeixinRegistrationPoll",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "403": { $ref: "../../components.yaml#/components/responses/Forbidden" }
        "502":
          description: upstream error from iLink API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/weixin/qr:
    post:
      tags: [weixin]
      summary: Start WeChat QR login flow (any authenticated user)
      operationId: startWeixinQR
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WeixinQRCode",
              }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "502":
          description: upstream error from iLink API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }

  /api/channels/weixin/qr/status:
    get:
      tags: [weixin]
      summary: Poll WeChat QR login status (any authenticated user)
      operationId: pollWeixinQRStatus
      parameters:
        - {
            name: qrcode,
            in: query,
            required: true,
            schema: { type: string },
            description: "QR code token from startWeixinQR",
          }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/WeixinQRStatus",
              }
        "400": {
          $ref: "../../components.yaml#/components/responses/BadRequest",
        }
        "401": {
          $ref: "../../components.yaml#/components/responses/Unauthorized",
        }
        "502":
          description: upstream error from iLink API
          content:
            application/json:
              schema: {
                $ref: "../../components.yaml#/components/schemas/Error",
              }
