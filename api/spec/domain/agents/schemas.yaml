openapi: 3.0.3
info:
  title: Agents Components
  version: "1"
paths: {}
components:
  schemas:
    SandboxNetworkConfig:
      type: object
      properties:
        mode: { type: string }
        allowlist: { type: array, items: { type: string } }

    SandboxConfig:
      type: object
      properties:
        network: { $ref: "#/components/schemas/SandboxNetworkConfig" }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        model_thinking: { type: string }
        model_strong: { type: string }
        model_strong_thinking: { type: string }
        model_fast: { type: string }
        model_fast_thinking: { type: string }
        system_prompt: { type: string }
        soul: { type: string }
        workspace: { type: string }
        sandbox: { $ref: "#/components/schemas/SandboxConfig" }
        scope: { type: string }
        creator_id:
          type: string
          readOnly: true
          description: >-
            The user who created the agent. Returned only to someone who may
            manage it, so an ordinary user cannot collect user ids from the
            agent list.
        can_manage:
          type: boolean
          readOnly: true
          description: >-
            Whether the calling user may configure this agent. The server's
            answer; clients must not recompute it from creator_id.
        enabled: { type: boolean }
        system_settings_tools_enabled:
          type: boolean
          description: >-
            Enables discovery of System Settings tools for direct foreground
            one-to-one human turns. Returned only to callers who can manage
            this Agent; it does not grant domain or deployment permissions.
        last_active: { type: string, format: date-time, nullable: true }

    AgentList:
      type: object
      required: [agents]
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }

    CreateAgentRequest:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        model: { type: string }
        model_thinking: { type: string }
        model_strong: { type: string }
        model_strong_thinking: { type: string }
        model_fast: { type: string }
        model_fast_thinking: { type: string }
        system_prompt: { type: string }
        soul: { type: string }
        workspace: { type: string }
        sandbox: { $ref: "#/components/schemas/SandboxConfig" }
        scope: { type: string }
        creator_id: { type: string }
        enabled: { type: boolean }
        system_settings_tools_enabled:
          type: boolean
          default: false
          description: >-
            Starts disabled unless the Agent manager explicitly enables
            Settings-tool discovery.
        template_id: { type: string }
        provider_credentials:
          type: array
          maxItems: 8
          description: >-
            Optional write-only API-key overrides for canonical global Providers.
            Omit to use deployment-global Provider keys.
          items:
            $ref: "#/components/schemas/AgentProviderCredentialInput"

    AgentProviderCredentialInput:
      type: object
      required: [provider_id, api_key]
      properties:
        provider_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Canonical global Provider ID; type aliases are not accepted.
        api_key:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
          description: Write-only API key override. Use DELETE to restore the global key.

    AgentProviderCredential:
      type: object
      required: [id, has_api_key, updated_at]
      properties:
        id:
          type: string
          readOnly: true
          description: Canonical global Provider ID for this override.
        has_api_key:
          type: boolean
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    AgentProviderCredentialList:
      type: object
      required: [provider_credentials, next_page_token, total_size]
      properties:
        provider_credentials:
          type: array
          items:
            $ref: "#/components/schemas/AgentProviderCredential"
        next_page_token:
          type: string
          nullable: true
        total_size:
          type: integer

    UpdateAgentProviderCredentialRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 1
          maxLength: 16384
          writeOnly: true
          description: Write-only replacement API key. Use DELETE to restore the global key.

    AgentUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }

    AgentUserList:
      type: object
      required: [users]
      properties:
        users: {
          type: array,
          items: { $ref: "#/components/schemas/AgentUser" },
        }

    AssignAgentUserRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }

    AgentTool:
      type: object
      required: [name, description, source, control]
      properties:
        name: { type: string }
        description: { type: string }
        source: { type: string }
        control:
          type: string
          enum: [override, system]
          description: >-
            override means a persisted tool override changes runner registration
            in this profile context. system means policy or runtime owns the row;
            clients must not offer an override control.
        enabled:
          type: boolean
          description: Present only when control is override.
        origin:
          type: string
          description: Present only when control is override; the winning override layer.
        family:
          type: string
          description: >-
            Stable backend-owned family identifier for grouping a non-MCP tool.
            Settings policy actions use display families such as
            agent_management; generated builtin actions use their toolmeta
            family; hand-written core and plugin tools use stable fallback
            families. Clients must not infer this value from the tool name.
        policy_reason:
          type: string
          enum: [
            core_sandbox,
            settings_policy,
            runtime_unavailable,
          ]
          description: Why a system-managed row cannot be overridden.
        availability_reason:
          type: string
          enum: [
            email_config_required,
            mcp_server_disabled,
            mcp_server_error,
            mcp_needs_auth,
          ]
          description: >-
            Concrete prerequisite that made a runtime-unavailable row absent or
            an override ineffective. mcp_* reasons mean the tool's server is
            disabled, unhealthy, or rejecting credentials; the override stays
            editable but has no effect until the server is healthy. Present
            only when the server's authoritative availability check
            establishes this reason; clients must not infer it from tool names.
        admin_required:
          type: boolean
          description: True when the Settings action requires a deployment administrator at execution time.
        input_schema:
          type: object
          additionalProperties: true
          description: >-
            JSON Schema for the tool's arguments. Present for core and builtin
            tools; omitted for plugin and MCP tools whose schema is not resolved
            by this endpoint.

    AgentToolList:
      type: object
      required: [tools]
      properties:
        tools: {
          type: array,
          items: { $ref: "#/components/schemas/AgentTool" },
        }

    UpdateAgentToolRequest:
      type: object
      properties:
        enabled: { type: boolean }
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
          default: user_agent

    Skill:
      type: object
      required: [lifecycle_version, created_by]
      properties:
        id: { type: string }
        scope:
          type: string
          enum: [project, user, user_agent, system, system_agent, builtin]
        user_id: { type: string }
        agent_id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        disable_model_invocation: { type: boolean }
        files: { type: array, items: { type: string } }
        source: { type: string }
        version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        lifecycle_version: { type: integer, format: int64 }
        content_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Exact immutable revision digest for mutable Home-backed Skills.
        created_by: { type: string, enum: [manual, reflect] }
        builtin:
          type: boolean
          readOnly: true
          description: True when this read-only Skill is supplied by the release bundle.
        logical_ref:
          type: string
          readOnly: true
          description: Exact AgentSkillPolicy ref when this Skill can be activated per Agent.
        enabled:
          type: boolean
          readOnly: true
          description: Effective Agent Skill activation, independent of disable_model_invocation.

    SkillScopeCounts:
      type: object
      required: [all, builtin, system, agent, user, project]
      properties:
        all: { type: integer }
        builtin: { type: integer }
        system: { type: integer }
        agent: { type: integer }
        user: { type: integer }
        project: { type: integer }

    SkillList:
      type: object
      required: [skills, total_size, scope_counts]
      properties:
        skills: { type: array, items: { $ref: "#/components/schemas/Skill" } }
        total_size: { type: integer }
        scope_counts: { $ref: "#/components/schemas/SkillScopeCounts" }
        next_page_token: { type: string, nullable: true }
        can_manage_activation: { type: boolean, readOnly: true }
        policy_diagnostics:
          $ref: "#/components/schemas/AgentSkillPolicyDiagnostics"

    AgentSkillPolicyDiagnostics:
      type: object
      required: [dangling_disabled_refs]
      properties:
        dangling_disabled_refs: { type: array, items: { type: string } }

    AgentSkillActivation:
      type: object
      required: [logical_ref, enabled]
      properties:
        logical_ref: { type: string }
        enabled: { type: boolean }

    UpdateAgentSkillActivationRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    CreateSkillRequest:
      type: object
      required: [name, scope]
      properties:
        name: { type: string }
        scope:
          type: string
          enum: [user, user_agent, system_agent]
        description: { type: string }
        disable_model_invocation: { type: boolean }
        files:
          type: object
          additionalProperties: { type: string }

    UpdateSkillRequest:
      type: object
      properties:
        expected_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Required exact current digest when mutating a Home-backed Skill.
        description: { type: string, nullable: true }
        disable_model_invocation: { type: boolean, nullable: true }
        # Overwrites only the "version" key in the skill's metadata; source and
        # install timestamps are preserved by a read-modify-write on the server.
        version: { type: string, nullable: true }
        convert_to_manual: { type: boolean }
        files:
          type: object
          additionalProperties: { type: string }

    InstallSkillRequest:
      type: object
      required: [source, scope]
      properties:
        source: { type: string }
        scope:
          type: string
          enum: [user, user_agent, system_agent]

    SkillFileResponse:
      type: object
      properties:
        path: { type: string }
        content: { type: string }
        encoding:
          type: string
          enum: [utf8, base64]
          description: >-
            How `content` is encoded. Omitted or `utf8` for text files;
            `base64` when the stored file is not valid UTF-8 (binary).

    SkillUpgradeResult:
      type: object
      properties:
        updated: { type: boolean }
        version: { type: string }
        previous_version: { type: string }

    AgentMCPServer:
      type: object
      required: [
        plugin_id,
        config_id,
        namespace,
        scope,
        enabled,
        credential_mode,
        needs_auth,
        status,
        tools,
        readable,
      ]
      additionalProperties: false
      description: >-
        Safe effective MCP projection for an agent. It intentionally omits the
        endpoint, payload, metadata, credential references, and OAuth details.
      properties:
        plugin_id: { type: string }
        config_id: { type: string }
        namespace: { type: string }
        scope:
          type: string
          enum: [user, user_agent, system, system_agent]
        enabled: { type: boolean }
        credential_mode:
          type: string
          enum: [shared, per_user]
        needs_auth: { type: boolean }
        status:
          type: string
          enum: [unknown, ok, error, needs_auth]
        tools:
          type: array
          items: { $ref: "#/components/schemas/MCPTool" }
        readable: { type: boolean }

    AgentMCPServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/AgentMCPServer" }
